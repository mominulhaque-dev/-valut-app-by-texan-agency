# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2a521e261e10c3525b6c2256b0c3f534"
name = "valut-app-by-texan-agency"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products"

# Ring data written back to each order. App-reserved namespace ($app):
# only this app can write it, merchants can read it in the admin, and it is
# hidden from the Storefront and Customer Account APIs. The scan link is a
# key to an unclaimed vault, so it must never be exposed to customers.
[order.metafields.app.rings]
type = "json"
name = "Vault rings"
description = "Ring IDs, scan links and QR files for the packing team"

  [order.metafields.app.rings.access]
  admin = "merchant_read"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
